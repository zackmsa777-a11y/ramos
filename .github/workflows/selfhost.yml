name: Self-hosting proof
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap, prove deterministic self-hosting, and test all stages
        run: make clean all selfhost
      - name: Preserve bootstrap proof and compiler
        uses: actions/upload-artifact@v4
        with:
          name: ramos-linux-x86_64-selfhost
          path: |
            ramos
            build/bootstrap-proof.json
