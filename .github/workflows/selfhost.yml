name: Self-hosting proof
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 xvfb xdotool xclip libcurl4t64
      - name: Bootstrap, prove Linux self-hosting, and build the Windows compiler
        run: make clean all selfhost windows
      - name: Verify a clean Linux compiler and library installation
        run: python3 tools/package_probe.py --compiler ./ramos --output build/linux-package-proof.json
      - name: Preserve native compilers and Linux proof
        uses: actions/upload-artifact@v4
        with:
          name: ramos-native-compilers
          path: |
            ramos
            build/ramos.exe
            build/bootstrap-proof.json
            build/linux-package-proof.json
            build/linux-scaling-proof.json
            build/linux-http-proof.json
  windows:
    needs: bootstrap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ramos-native-compilers
          path: native
      - name: Prove native Windows self-hosting and run the shared language corpus
        shell: pwsh
        env:
          RAMOS_WINDOWS_COMPILER: native/build/ramos.exe
        run: python tools/windows_proof.py
      - name: Verify a clean native Windows compiler and library installation
        shell: pwsh
        run: python tools/package_probe.py --compiler native/build/ramos.exe --output build/windows-package-proof.json
      - name: Preserve Windows compiler and proof
        uses: actions/upload-artifact@v4
        with:
          name: ramos-windows-x86_64-selfhost
          path: |
            native/build/ramos.exe
            build/windows-bootstrap-proof.json
            build/windows-package-proof.json
            build/windows-scaling-proof.json
            build/windows-canvas-proof.json
            build/windows-http-proof.json
